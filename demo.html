<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<title>Model Constellation Matrix · 预览</title>
<style>
  :root { color-scheme: light; }
  html, body { margin: 0; height: 100%; }
  body {
    font-family: ui-sans-serif, system-ui, "Segoe UI", "Microsoft YaHei", sans-serif;
    background: radial-gradient(1200px 600px at 20% -10%, #eef4ff 0%, #f7f9fc 45%, #f3f5f9 100%);
    color: #0f172a;
  }
  .stage { height: 100%; display: flex; flex-direction: column; justify-content: flex-end; align-items: center; padding: 24px; box-sizing: border-box; }
  .composer {
    width: min(880px, 96vw); background: #fff; border: 1px solid rgba(15,23,42,.08);
    border-radius: 22px; padding: 14px 16px 10px; box-shadow: 0 18px 50px -30px rgba(15,23,42,.5);
  }
  .composer .line { font-size: 13px; color: #94a3b8; padding: 8px 2px 26px; }
  .composer .foot { display: flex; align-items: center; justify-content: flex-end; gap: 10px; min-height: 30px; }
  .ghost { height: 28px; display: inline-flex; align-items: center; padding: 0 10px; border-radius: 999px; background: #f1f5f9; color: #64748b; font-size: 12px; }
  .hint { position: fixed; left: 16px; top: 12px; font: 11px/1.5 ui-monospace, monospace; color: #94a3b8; }
</style>
</head>
<body>
<div class="hint">mock: <span id="src">loading…</span> · 追加 <code>?catalog=/path/to/catalog.json</code> 可换任意模拟目录</div>
<div class="stage">
  <div class="composer">
    <div class="line">预览模式：模拟 DSH 输入框底部一行（右侧为模型位）。</div>
    <div class="foot" id="slot"></div>
  </div>
</div>

<script type="module">
  import * as React from "https://esm.sh/react@18.3.1";
  import * as ReactDOM from "https://esm.sh/react-dom@18.3.1";
  import { createRoot } from "https://esm.sh/react-dom@18.3.1/client";

  // Any JSON with { groups: [{ id, name, models }], current? } works here.
  const catalogUrl = new URLSearchParams(location.search).get("catalog") || "./demo/mock-catalog.json";
  document.getElementById("src").textContent = catalogUrl;

  const catalog = await (await fetch(catalogUrl)).json();
  let snapshot = {
    status: "ready",
    groups: catalog.groups || [],
    failures: [],
    current: catalog.current || null,
  };

  const listeners = new Set();
  const store = {
    subscribe(cb) { listeners.add(cb); return () => listeners.delete(cb); },
    getSnapshot() { return snapshot; },
  };

  window.__ModuleLoader__ = {
    load(def) {
      const provided = { "react": React, "react-dom": ReactDOM };
      window.__pcm = def.factory((name) => {
        if (!(name in provided)) throw new Error("missing module " + name);
        return provided[name];
      });
    },
  };

  const slot = document.getElementById("slot");
  const ghost = document.createElement("button");
  ghost.className = "ghost";
  ghost.textContent = snapshot.current ? `${snapshot.current.model} ${snapshot.current.reasoningEffort || ""}` : "请选择模型";
  slot.appendChild(ghost);
  const mount = document.createElement("span");
  mount.style.display = "inline-flex";
  slot.appendChild(mount);

  await new Promise((resolve, reject) => {
    const script = document.createElement("script");
    script.src = "./lib/client.js";
    script.onload = resolve;
    script.onerror = reject;
    document.body.appendChild(script);
  });

  createRoot(mount).render(
    React.createElement(window.__pcm.PeriodicPicker, {
      available: true,
      locked: false,
      directory: store,
      load: () => {},
      select: (selection) => {
        snapshot = { ...snapshot, current: { ...selection } };
        listeners.forEach((cb) => cb());
        return Promise.resolve({ ok: true });
      },
    }),
  );
</script>
<script>
  window.addEventListener("error", (e) => {
    const el = document.createElement("div");
    el.style.cssText = "position:fixed;left:16px;top:36px;font:12px monospace;color:#b91c1c";
    el.textContent = "预览加载失败: " + (e.message || "unknown");
    document.body.appendChild(el);
  });
</script>
</body>
</html>
